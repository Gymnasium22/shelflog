name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch deploy (gh-pages) only needs contents:write.
# One-time setup: Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages bundle
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_APP_URL: https://gymnasium22.github.io/shelflog

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
          cname: ""
